name: Sync thiennp.github.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "external/thiennp.github.io/**"
      - ".github/workflows/sync-thiennp-github-io.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push Agent Witch HTML to portfolio repo
        if: ${{ secrets.THIENNP_GITHUB_IO_DEPLOY_TOKEN != '' }}
        env:
          THIENNP_GITHUB_IO_DEPLOY_TOKEN: ${{ secrets.THIENNP_GITHUB_IO_DEPLOY_TOKEN }}
        run: bash .agents/scripts/pushThiennpGithubIo.sh
      - name: Skip (no deploy token)
        if: ${{ secrets.THIENNP_GITHUB_IO_DEPLOY_TOKEN == '' }}
        run: echo "Set THIENNP_GITHUB_IO_DEPLOY_TOKEN to sync thiennp.github.io"
