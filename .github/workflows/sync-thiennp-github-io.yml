name: Sync thiennp.github.io

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "external/thiennp.github.io/**"
      - ".github/workflows/sync-thiennp-github-io.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push Agent Witch HTML to portfolio repo
        env:
          THIENNP_GITHUB_IO_DEPLOY_TOKEN: ${{ secrets.THIENNP_GITHUB_IO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$THIENNP_GITHUB_IO_DEPLOY_TOKEN" ]; then
            echo "Set THIENNP_GITHUB_IO_DEPLOY_TOKEN to sync thiennp.github.io"
            exit 0
          fi
          bash .agents/scripts/pushThiennpGithubIo.sh
