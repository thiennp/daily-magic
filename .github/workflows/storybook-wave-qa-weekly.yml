name: Storybook page wave QA (weekly)

on:
  schedule:
    # Saturday 02:00 UTC (09:00 Vietnam ICT)
    - cron: "0 2 * * 6"
  workflow_dispatch:

concurrency:
  group: storybook-wave-qa-weekly
  cancel-in-progress: false

jobs:
  capture:
    name: Build Storybook and capture page waves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:wave:weekly

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-wave-captures-${{ github.run_id }}
          path: storybook-wave-captures/
          retention-days: 30
