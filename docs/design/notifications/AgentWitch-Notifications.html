    <div class="stack" style="gap:var(--sp-2)">${S.comp === 'unlinked' ? btn('Connect this computer', { cls: 'primary sm block', icon: 'monitor', a: 'connectThis' }) : ''}${btn('Connect another computer', { cls: 'sm block', icon: 'plus', a: 'connectOther' })}<a class="btn sm block" id="dl-local" href="${esc(URLS.download || '#')}" target="_blank" rel="noopener">${ic('dl', 16)}<span>Download AgentWitch Local</span><span class="sr"> (opens in a new tab)</span></a></div></section>`;
}

/* ---------- bell + popover ---------- */
function renderBell() {
  const b = $('#bell'); if (!b) return; const u = unreadN(), p = pending().length;
  b.setAttribute('aria-label', 'Notifications' + (S.load === 'ok' ? ', ' + plural(u, 'unread').replace('unreads', 'unread') + (p ? ', ' + p + ' waiting for approval' : '') : ''));
  b.setAttribute('aria-expanded', String(S.pop));
  $('.bell-badge', b).textContent = u > 9 ? '9+' : String(u);
  $('.bell-badge', b).hidden = !(S.load === 'ok' && u > 0);
}
function renderPop() {
  const box = $('#bell-pop'); box.hidden = !S.pop || !signedIn(); renderBell(); if (box.hidden) return;
  const k = fkey(document.activeElement), inPop = box.contains(document.activeElement);
  let body;
  if (S.load === 'loading') body = `<div class="bp-list">${skel(3)}</div>`;
  else if (S.load === 'error') body = `<div class="bp-state">${errBox('pop')}</div>`;
  else { const L = list(S.pf).slice(0, 6); body = `<ul class="bp-list" aria-label="${esc(FILTERS.find(f => f[0] === S.pf)[1])} notifications">${L.length ? L.map(x => item(x, 'pp')).join('') : `<li>${emptyBox(S.pf).replace(/<button[^>]*data-a="filter"[^>]*>.*?<\/button>/, '')}</li>`}</ul>`; }
  box.innerHTML = `<div class="bp-head"><h2 id="bp-h">${ic('nbell', 18)}Notifications</h2>${btn('Mark all read', { cls: 'sm ghost', icon: 'checkAll', a: 'readAll', id: 'bp-readall', ok: S.load === 'ok' && unreadN() > 0, why: S.load !== 'ok' ? 'Notifications are still loading.' : 'Nothing unread.' })}</div>
    ${S.net ? '' : `<p class="off-banner" style="margin:0 12px 8px">${ic('wifioff', 16)}You are offline.</p>`}
    ${filterBar(S.pf, 'pfilter', 'Filter notifications in this panel', 'bp-filters')}
    ${body}
    <div class="bp-foot"><button type="button" class="btn sm primary" data-a="seeAll" id="bp-all">See all notifications</button><a class="btn sm ghost" href="${esc(URLS.account)}" target="_blank" rel="noopener">${ic('gear', 15)}Notification settings<span class="sr"> on your Account page (opens in a new tab)</span></a></div>`;
  if (inPop) { const t = k && $$('[data-a],[id]', box).find(x => fkey(x) === k && x.offsetParent !== null); if (t) t.focus({ preventScroll: true }); else { const h = $('#bp-h', box); h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
}
function popOpen(open, focus) {
  S.pop = open; renderPop();
  if (open && focus) { const f = $('#bell-pop [data-a="pfilter"][aria-pressed="true"]'); if (f) f.focus(); }
  if (!open && focus) $('#bell').focus();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.pop && !modalState) { const inside = $('#bell-pop').contains(document.activeElement) || document.activeElement === $('#bell'); popOpen(false, inside); }
});
document.addEventListener('mousedown', e => { if (S.pop && !modalState && !e.target.closest('.bell-wrap') && !e.target.closest('.modal-scrim') && !e.target.closest('.toasts')) popOpen(false); });
document.addEventListener('focusin', e => { if (S.pop && !modalState && !e.target.closest('.bell-wrap') && !e.target.closest('.modal-scrim') && !e.target.closest('#tip') && !e.target.closest('.toasts')) { S.pop = false; renderPop(); } });

/* ---------- page ---------- */
function renderHead() {
  if (!signedIn()) { $('#head').innerHTML = ''; return; }
  const u = unreadN(), p = pending().length, ok = S.load === 'ok';
  $('#head').innerHTML = `<div class="page-head"><div class="ph-main"><nav class="crumb" aria-label="Breadcrumb"><span>Inbox</span><span aria-hidden="true">›</span><span aria-current="page">Notifications</span></nav>
    <div class="title-row"><h1 id="page-h" tabindex="-1">Notifications</h1>${tip('Updates from your projects and anything that needs your OK. What reaches you by email is set on your Account page.', 'About notifications')}</div>
    <p class="muted" aria-live="polite">${ok ? `${u ? plural(u, 'unread').replace('unreads', 'unread') : 'Nothing unread'}${p ? ' · ' + p + ' waiting for your approval' : ''}` : S.load === 'loading' ? 'Loading…' : '&nbsp;'}</p></div>
    <div class="nt-head-actions">${btn('Mark all read', { icon: 'checkAll', a: 'readAll', id: 'pg-readall', ok: ok && u > 0 && true, why: !ok ? 'Notifications are still loading.' : 'Nothing unread.' })}<a class="btn" href="${esc(URLS.account)}" target="_blank" rel="noopener" id="pg-settings">${ic('gear', 16)}<span>Notification settings</span><span class="sr"> on your Account page (opens in a new tab)</span></a></div></div>`;
}
function renderBanners() {
  const b = $('#banners'); if (!signedIn()) { b.innerHTML = ''; return; }
  b.innerHTML = S.net ? '' : `<p class="off-banner" role="status">${ic('wifioff', 18)}<span>You are offline. You can read what was loaded. Approve and Deny work again once you are back online.</span></p>`;
}
function sideCards() {
  const p = pending(), joins = p.filter(x => x.kind === 'join'), runs = p.filter(x => x.kind === 'run');
  const projs = [...new Set(joins.map(x => x.project))];
  return `<aside class="nt-side" aria-label="Summary">
    <section class="card"><h2>${ic('hourglass', 18)}Waiting for you</h2>
      ${p.length ? `<ul class="sum-list"><li>${ic('userplus', 16)}<span class="g">Join requests</span><b>${joins.length}</b></li><li>${ic('monitor', 16)}<span class="g">Tasks on a computer</span><b>${runs.length}</b></li></ul>
      ${S.filter !== 'approvals' ? btn('Show approvals', { cls: 'sm primary block', a: 'filter', d: { v: 'approvals' }, id: 'side-showap' }) : ''}` : `<p class="muted">Nothing needs your OK right now.</p>`}
      ${runs.length ? `<p class="muted" style="font-size:var(--fs-sm)">Tasks stop by themselves if nobody answers within ${RUN_WAIT_MIN} min.</p>` : ''}</section>
    <section class="card"><h2>${ic('info', 18)}Good to know</h2>
      <ul class="where">
        <li>${ic('gear', 16)}<span>Email, in-app and quiet hours are set in ${linkTo2('account', 'Notification settings')} on your Account page.</span></li>
        <li>${ic('users', 16)}<span>Join requests also stay in each project's Access panel${projs.length ? ': ' + projs.map(n => linkTo2('project', n)).join(', ') : ''}. Approving in either place does the same thing.</span></li>
        <li>${ic('shield', 16)}<span>Why a task asks first is set by the safety rules inside each project.</span></li>
      </ul></section></aside>`;
}
function renderPanel() {
  const P = $('#panel');
  if (!signedIn()) {
    P.innerHTML = `<section class="gate" aria-labelledby="gate-h"><span class="ei" aria-hidden="true">${ic('nbell', 28)}</span><h2 id="gate-h" tabindex="-1">Sign in to see your notifications</h2><p>Updates from your projects and anything waiting for your approval show up here.</p>${btn('Sign in', { cls: 'primary lg', a: 'signin', id: 'gate-signin', ok: S.net, why: 'No internet connection.' })}<a href="${esc(URLS.download || '#')}" target="_blank" rel="noopener">Download AgentWitch Local<span class="sr"> (opens in a new tab)</span></a></section>`;
    return;
  }
  let main;
  if (S.load === 'loading') main = skel(5);
  else if (S.load === 'error') main = errBox('page');
  else {
    const L = list(S.filter), p = pending().length;
    let html = '';
    if (S.filter !== 'approvals' && p) html += `<div class="nt-callout"><p class="g">${ic('hourglass', 18)}${p === 1 ? '1 item is' : p + ' items are'} waiting for your approval</p>${btn('Show approvals', { cls: 'sm', a: 'filter', d: { v: 'approvals' }, id: 'callout-ap' })}</div>`;
    if (!L.length) html += emptyBox(S.filter);
    else if (S.filter === 'approvals') html += `<h3 class="nt-day">Needs your OK</h3><ul class="nt-list">${L.map(x => item(x, 'pg')).join('')}</ul>`;
    else { let last = ''; html += L.reduce((o, x) => { const d = dayOf(x.at); const h = d !== last ? (last ? '</ul>' : '') + `<h3 class="nt-day">${d}</h3><ul class="nt-list">` : ''; last = d; return o + h + item(x, 'pg'); }, '') + '</ul>'; }
    if (S.filter === 'approvals') { const H2 = handled(); if (H2.length) html += `<h3 class="nt-day">Handled recently</h3><ul class="nt-list">${H2.map(x => item(x, 'pg')).join('')}</ul>`; }
    if (S.filter === 'all' && S.items.length) html += moreHtml();
    main = html + `<p class="nt-tip">${ic('gear', 15)}<span>Want fewer emails? Change what reaches you in ${linkTo2('account', 'Notification settings')}.</span></p>`;
  }
  P.innerHTML = `<div class="nt-wrap"><div class="nt-grid"><section class="nt-main" aria-labelledby="page-h"><div class="nt-bar">${filterBar(S.filter, 'filter', 'Filter notifications')}</div><div id="nt-list" class="nt-main" aria-busy="${S.load === 'loading'}">${main}</div></section>${S.load === 'ok' ? sideCards() : ''}</div></div>`;
}
function render(parts) {
  const k = fkey(document.activeElement), all = !parts, inPop = $('#bell-pop').contains(document.activeElement);
  if (all || parts.side) renderSide();
  if (all || parts.head) renderHead();
  if (all || parts.banners) renderBanners();
  if (all || parts.panel) renderPanel();
  renderPop();
  if (!inPop && k && (document.activeElement === document.body || !document.activeElement)) { const t = $$('#head [data-a],#head [id],#side [data-a],#banners [data-a],#panel [data-a],#panel [id]').find(x => fkey(x) === k && x.offsetParent !== null); if (t) t.focus({ preventScroll: true }); }
}
function fkey(el) { if (!el || el === document.body) return ''; if (el.dataset && el.dataset.a) return el.dataset.a + '|' + (el.dataset.v || '') + '|' + (el.dataset.src || ''); return el.id || ''; }

/* ---------- actions ---------- */
function markRead(x) { if (x && x.unread) { x.unread = false; } }
function decide(b, verb) {
  const x = getI(b.dataset.v), src = b.dataset.src; if (!x || x.state !== 'pending') return;
  const g = apGate(x); if (!g.ok) { toast(g.why); return; }
  const go = () => { later(run, 0); };
  const run = () => {
    if (x.state !== 'pending') { toast(x.state === 'timeout' ? 'Too late. This task already timed out.' : 'This was already handled.'); render(); return; }
    S.busy[x.id] = verb; render({ panel: true });
    later(() => {
      delete S.busy[x.id];
      if (!S.net || S.fail) { render(); toast('Could not ' + verb + '. Try again.', { error: true }); return; }
      x.state = verb === 'approve' ? 'approved' : 'denied'; x.doneAt = Date.now(); markRead(x);
      render();
      const msg = verb === 'approve'
        ? (x.kind === 'join' ? 'Approved. ' + x.who + ' can now open ' + x.project + '.' : 'Approved. ' + x.who + ' is running the task on ' + compName(x.computer) + '.')
        : (x.kind === 'join' ? 'Denied. ' + x.who + ' was not added.' : 'Denied. Nothing ran.');
      toast(msg);
      const keep = src === 'pp' ? $('#bell-pop [data-a="pfilter"][aria-pressed="true"]') : ($('#pg-' + x.id) || $('#page-h'));
      if (keep) { if (!keep.matches('button,a,[tabindex]')) keep.setAttribute('tabindex', '-1'); keep.focus({ preventScroll: true }); }
    }, 700);
  };
  if (verb === 'deny') {
    confirmModal(x.kind === 'join'
      ? { title: 'Deny ' + x.who + '?', text: x.who + ' will not get access to ' + x.project + '. They can ask again later.', go: 'Deny', danger: true, fn: go }
      : { title: 'Deny this task?', text: x.who + ' will not run “' + x.task + '” on ' + compName(x.computer) + '.', go: 'Deny', danger: true, fn: go });
  } else run();
}
Object.assign(A, {
  bell: () => popOpen(!S.pop, true),
  pfilter: b => { S.pf = b.dataset.v; renderPop(); const f = $('#bell-pop [data-a="pfilter"][data-v="' + S.pf + '"]'); if (f) f.focus(); },
  filter: b => { S.filter = b.dataset.v; render({ panel: true, head: true }); const f = $('#panel [data-a="filter"][aria-pressed="true"]'); if (f) f.focus(); },
  seeAll: () => { S.filter = S.pf; S.pop = false; render({ panel: true }); focusEl('#page-h'); window.scrollTo({ top: 0 }); },
  toggleRead: b => { const x = getI(b.dataset.v); if (!x) return; if (!S.net) { toast('No internet connection.'); return; } x.unread = !x.unread; render({ head: true, panel: true }); toast(x.unread ? 'Marked as unread' : 'Marked as read'); },
  openLink: b => { const x = getI(b.dataset.v); if (x && x.unread) { x.unread = false; later(() => render({ head: true, panel: true }), 0); } },
  readAll: () => {
    if (!S.net) { toast('No internet connection.'); return; }
    const was = S.items.filter(x => x.unread).map(x => x.id); if (!was.length) return;
    S.items.forEach(markRead); render({ head: true, panel: true });
    undoable('Marked ' + plural(was.length, 'notification') + ' as read', () => { was.forEach(id => { const x = getI(id); if (x) x.unread = true; }); render({ head: true, panel: true }); toast('Restored'); });
  },
  more: () => {
    if (!S.net) { toast('No internet connection.'); return; } S.olderState = 'loading'; render({ panel: true });
    later(() => {
      if (S.moreFail) { S.olderState = 'error'; render({ panel: true }); focusEl('#retry-more'); return; }
      const take = S.older.splice(0, 4); take.forEach((o, i) => S.items.push({ id: 'o' + rand(5), kind: o[0], title: o[1], text: o[2], project: o[3] || undefined, at: ago2(60 * 24 * (6 + i)), unread: false }));
      S.olderState = 'idle'; render({ panel: true }); toast(plural(take.length, 'older notification') + ' loaded'); focusEl('#page-h');
    }, 700);
  },
  approve: b => decide(b, 'approve'),
  deny: b => decide(b, 'deny'),
  retryLoad: b => { const src = b.dataset.src; S.load = 'loading'; render(); later(() => { S.load = S.loadFailAgain ? 'error' : 'ok'; S.loadFailAgain = false; syncDev(); render(); if (src === 'pop') { const f = $('#bell-pop [data-a="pfilter"][aria-pressed="true"]') || $('#bell-pop #bp-h'); if (f) f.focus(); } else focusEl('#page-h'); }, 900); },
  signin: () => { if (!S.net) return; S.auth = 'in'; S.load = 'loading'; layout(); syncDev(); render(); focusEl('#page-h'); toast('Signed in'); later(() => { S.load = 'ok'; syncDev(); render(); }, 900); },
  devReset: () => { clearTimers(); closeModal(true); S = nState(); S.load = 'ok'; layout(); renderDev(); render(); toast('Reset'); }
});

/* run approvals expire: check every 5 s, re-render only when something visible changes */
let lastSig = '';
setInterval(() => {
  if (!signedIn() || S.load !== 'ok') return; let changed = false;
  S.items.forEach(x => { if (x.kind === 'run' && x.state === 'pending' && !S.busy[x.id] && x.expires <= Date.now()) { x.state = 'timeout'; x.unread = true; changed = true; } });
  if (changed) toast('A task timed out waiting for approval. Nothing ran.');
  const sig = pending().filter(x => x.kind === 'run').map(x => x.id + minsLeft(x)).join();
  if (changed || sig !== lastSig) { lastSig = sig; render({ head: true, panel: true }); }
}, 5000);

/* ---------- dev corner (not part of the product) ---------- */
document.addEventListener('change', e => {
  const t = e.target; if (!t.closest || !t.closest('#dev-body')) return; const v = t.value;
  if (t.id === 'dv-auth') { S.auth = v; layout(); }
  else if (t.id === 'dv-ld') S.load = v;
  else if (t.id === 'dv-net') S.net = t.checked;
  else if (t.id === 'dv-fail') S.fail = t.checked;
  else if (t.id === 'dv-mf') S.moreFail = t.checked;
  else if (t.id === 'dv-ap') { if (v === 'none') S.items.forEach(x => { if (isAp(x) && x.state === 'pending') { x.state = 'approved'; x.doneAt = Date.now(); x.unread = false; } }); else { const f = seed(); S.items = S.items.map(x => isAp(x) ? f.find(y => y.id === x.id) : x); } }
  else if (t.id === 'dv-items') S.items = v === 'none' ? [] : v === 'read' ? seed().map(x => (x.unread = false, x)) : seed();
  else if (t.id === 'dv-exp') { const r = S.items.find(x => x.id === 'r1'); if (r && r.state === 'pending') r.expires = Date.now() + (v === 'soon' ? 0.4 * MIN : 24 * MIN); }
  else if (t.id === 'dv-pop') S.pop = v === 'open';
  render();
});
function syncDev() { const e = $('#dv-ld'); if (e) e.value = S.load; const a = $('#dv-auth'); if (a) a.value = S.auth; }
function renderDev() {
  const o = (id, l, opts) => `<div class="field"><label class="label" for="${id}">${l}</label><select class="select" id="${id}">${opts.map(x => `<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div>`;
  $('#dev-body').innerHTML = o('dv-auth', 'Signed in', [['in', 'Yes'], ['out', 'No']]) + o('dv-ld', 'Inbox data', [['ok', 'Loaded'], ['loading', 'Loading'], ['error', 'Load error']])
    + o('dv-items', 'Notifications', [['some', 'Sample set'], ['read', 'All read'], ['none', 'None']]) + o('dv-ap', 'Pending approvals', [['some', 'Some'], ['none', 'None']])
    + o('dv-exp', 'Computer task waits', [['long', '24 min left'], ['soon', 'Times out in seconds']]) + o('dv-pop', 'Bell panel', [['open', 'Open'], ['closed', 'Closed']])
    + `<label class="check"><input type="checkbox" id="dv-net" checked><span class="check-text">Internet</span></label><label class="check"><input type="checkbox" id="dv-fail"><span class="check-text">Approve / Deny fails</span></label><label class="check"><input type="checkbox" id="dv-mf"><span class="check-text">Loading older fails</span></label><div class="cluster" style="margin-top:var(--sp-2)">${btn('Reset', { cls: 'sm', a: 'devReset' })}</div>`;
}
renderDev(); layout(); S.pop = !matchMedia('(max-width: 900px)').matches; render();
later(() => { S.load = 'ok'; syncDev(); render(); const p = $('#dv-pop'); if (p) p.value = S.pop ? 'open' : 'closed'; }, 900);

})();
</script>
