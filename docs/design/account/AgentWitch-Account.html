    <section class="card ac-card" id="ac-ses" aria-labelledby="se-h"><div class="ac-hd"><h2 id="se-h">Where you are signed in ${tip('Browsers and AgentWitch apps that can use your account. Signing out an app on a computer pauses its assistants until you sign in again.', 'About sessions')}</h2>${btn('Sign out everywhere else', { cls: 'sm', icon: 'logout', a: 'outAll', id: 'out-all', ok: g.ok && o.length > 0, why: !g.ok ? g.why : 'You are only signed in here.' })}</div>
    <ul class="ac-list">${S.sessions.map(s => `<li class="ac-row" data-id="${s.id}"><div class="g"><b>${ic(s.kind === 'local' ? 'monitor' : 'device', 16)} ${esc(s.name)}${s.cur ? ' <span class="chip sm info">This browser</span>' : ''}</b><span>${esc(s.place)} · ${s.cur ? 'Active now' : when(s.at)}</span></div><div class="c">${s.cur ? btn('Sign out', { cls: 'sm', a: 'outHere', id: 'out-here', ok: S.net, why: WHYM.offline }) : btn('Sign out', { cls: 'sm', a: 'outOne', d: { v: s.id }, ok: g.ok, why: g.why, label: 'Sign out ' + s.name })}</div></li>`).join('')}</ul>
    ${o.length ? '' : `<div class="empty">${ic('shield2', 22)}<h4>No other sessions</h4><p>You are signed in only on this browser.</p></div>`}</section>`;
}

/* ---------- notifications ---------- */
function sw(on, label, a, v, g, k) { return `<button type="button" class="switch" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-a="${a}" data-v="${v}" data-k="${k}"${g.ok ? '' : ` aria-disabled="true" data-why="${esc(g.why)}"`}><i></i></button>`; }
function notifyHtml() {
  const g = gate(false), q = S.quiet, hrs = Array.from({ length: 24 }, (_, i) => p2(i) + ':00');
  return `<section class="card ac-card" id="ac-nf2" aria-labelledby="nt-h"><div class="ac-hd"><h2 id="nt-h">What we tell you ${tip('Choose email and in-app notes for each event. Changes save as you go.', 'About notifications')}</h2>${btn(S.testSent ? 'Test email sent' : 'Send a test email', { cls: 'sm', icon: 'mail', a: 'testMail', id: 'test-mail', ok: g.ok, why: g.why })}</div>
    <div class="ac-nth" aria-hidden="true"><span style="text-align:left">Event</span><span>Email</span><span>In app</span></div>
    <ul class="ac-list">${S.notify.map(n => { const ge = n.lock ? { ok: false, why: n.lock } : g; return `<li class="ac-nt"><div class="g"><b>${esc(n.t)}</b><span>${esc(n.d)}</span></div><div class="sw">${sw(n.email, n.t + ', email', 'nt', n.id, ge, 'email')}</div><div class="sw">${sw(n.app, n.t + ', in the app', 'nt', n.id, g, 'app')}</div></li>`; }).join('')}</ul></section>
    <section class="card ac-card" id="ac-quiet" aria-labelledby="qh-h"><div class="ac-hd"><h2 id="qh-h">Quiet hours ${tip('No emails or in-app notes during these hours. Approvals wait until quiet hours end.', 'About quiet hours')}</h2>${sw(q.on, 'Quiet hours', 'quiet', 'on', g, 'on')}</div>
    <div class="ac-quiet"><div class="field"><label class="label" for="q-from">From</label><select class="select" id="q-from"${q.on && g.ok ? '' : ` aria-disabled="true" data-why="${esc(g.ok ? 'Turn quiet hours on first.' : g.why)}"`}>${hrs.map(h => `<option${q.from === h ? ' selected' : ''}>${h}</option>`).join('')}</select></div><div class="field"><label class="label" for="q-to">To</label><select class="select" id="q-to"${q.on && g.ok ? '' : ` aria-disabled="true" data-why="${esc(g.ok ? 'Turn quiet hours on first.' : g.why)}"`}>${hrs.map(h => `<option${q.to === h ? ' selected' : ''}>${h}</option>`).join('')}</select></div></div>
    <p class="help" style="margin:0">${q.on ? 'Quiet from ' + q.from + ' to ' + q.to + ' (' + S.tz + ').' : 'Quiet hours are off.'}</p></section>`;
}

/* ---------- privacy and data ---------- */
function blockers() {
  const b = [];
  if (S.managed) b.push({ ok: false, t: 'Your account is managed by ' + MANAGER + '. Only an admin can delete it.' });
  else {
    b.push(S.plan === 'pro' || S.plan === 'team' ? { ok: false, t: 'You have an active ' + (S.plan === 'pro' ? 'Pro' : 'Team') + ' plan. Cancel it on the Pricing page first.', act: 'billing', l: 'Open billing' } : { ok: true, t: 'No paid plan to cancel.' });
    b.push(S.shared.length ? { ok: false, t: 'You are the only owner of ' + S.shared.join(' and ') + ', which have other people. Make someone else an owner, or delete the project first.' } : { ok: true, t: 'You are not the only owner of any shared project.' });
  }
  return b;
}
function privHtml() {
  const g = gate(false), bl = blockers(), can = bl.every(x => x.ok) && !S.delAt, ex = S.exportAt;
  const why = !S.net ? WHYM.offline : S.delAt ? 'Deletion is already scheduled.' : (bl.find(x => !x.ok) || {}).t || '';
  return `<section class="card ac-card" id="ac-hist" aria-labelledby="hs-h"><h2 id="hs-h">Your history stays on your computers ${tip('Tasks, replies and files are stored on the computer where an assistant ran them. The website only shows a notice.', 'About history')}</h2>
    <p style="margin:0">AgentWitch does not keep your task history on its servers. Open AgentWitch on this computer to read it. Deleting your account does not touch files on your computers.</p></section>
    <section class="card ac-card" id="ac-exp" aria-labelledby="ex-h"><div class="ac-hd"><h2 id="ex-h">Export your account data</h2>${btn(ex ? 'Export requested' : 'Request export', { cls: 'sm', icon: 'mail', a: 'exportData', id: 'export-btn', ok: g.ok && !ex, why: !g.ok ? g.why : 'You already asked. Check your email.' })}</div>
    <p style="margin:0">We email a download link to <b>${esc(S.email)}</b> within 24 hours. It includes your profile, billing records, and your projects and companies. It does not include history, which stays on your computers.</p>${ex ? `<span class="chip sm success" style="align-self:flex-start">${ic('check', 12)} Requested ${when(ex)}</span>` : ''}</section>
    <section class="card ac-card ac-danger" id="ac-del" aria-labelledby="dl-h"><h2 id="dl-h">Delete your account ${tip('Your account is removed after 7 days. You can cancel during that time. This cannot be undone afterwards.', 'About deleting your account')}</h2>
    <p style="margin:0">Before you can delete your account:</p><ul class="ac-blk">${bl.map(x => `<li class="${x.ok ? 'ok' : 'no'}">${ic(x.ok ? 'check' : 'alert', 16)}<span>${esc(x.t)}</span>${x.act ? btn(x.l, { cls: 'sm', a: x.act, ok: true }) : ''}</li>`).join('')}</ul>
    <div class="cluster">${btn('Delete my account', { cls: 'danger', icon: 'trash', a: 'delAcc', id: 'del-acc', ok: can && S.net, why })}</div></section>`;
}
function tabHtml() { return S.tab === 'profile' ? profileHtml() : S.tab === 'security' ? secHtml() : S.tab === 'notify' ? notifyHtml() : privHtml(); }
function renderPanel() {
  const P = $('#panel');
  if (!signedIn()) { P.innerHTML = `<div class="empty">${ic('lock', 22)}<h4>Sign in to see your account</h4><p>Your profile, sign-in methods and notifications belong to your account.</p>${btn('Sign in', { cls: 'primary', icon: 'login', a: 'signin', id: 'empty-signin', ok: S.net, why: WHYM.offline })}</div>`; return; }
  if (S.load === 'loading') { P.innerHTML = `<p class="sr" role="status">Loading…</p><div class="ac-wrap" aria-hidden="true"><div class="ac-grid"><section class="card ac-card ac-sk"><div class="skel-row" style="width:60%"></div><div class="skel-row" style="width:50%"></div><div class="skel-row" style="width:70%"></div></section><div class="ac-main"><section class="card ac-card ac-sk"><div class="skel-row" style="width:30%"></div><div class="skel-row"></div></section><section class="card ac-card ac-sk"><div class="skel-row" style="width:40%"></div><div class="skel-row"></div></section></div></div></div>`; return; }
  if (S.load === 'error') { P.innerHTML = `<div class="empty err" role="alert">${ic('alert', 22)}<h4>Could not load your account</h4><p>Check your connection and try again.</p>${btn('Try again', { cls: 'primary', icon: 'refresh', a: 'retryLoad', id: 'retry-load' })}</div>`; return; }
  P.innerHTML = `<div class="ac-wrap"><div class="ac-grid"><nav class="au-tabs ac-nav" aria-label="Account sections">${TABS.map(t => `<button type="button" data-a="tab" data-v="${t[0]}"${S.tab === t[0] ? ' aria-current="page"' : ''}>${ic(t[2], 16)}<span>${t[1]}</span></button>`).join('')}</nav><div class="ac-main" id="ac-body">${tabHtml()}</div></div></div>`;
}
function renderBody() { const e = $('#ac-body'); if (e) e.innerHTML = tabHtml(); }

/* ---------- modals ---------- */
function signInModal() {
  modal({ title: 'Sign in to continue', body: `<p class="muted">Your profile, sign-in methods and notifications belong to your account.</p><div class="mk-sign"><span class="avatar lg" aria-hidden="true">T</span><span><b>${esc(ACCOUNT)}</b><br><span class="muted">Your account</span></span></div>`, focus: '.btn.primary',
    actions: [{ label: 'Cancel' }, { label: 'Sign in', cls: 'primary', fn: () => { if (!S.net) { toast(WHYM.offline, { error: true }); return false; } later(() => { S.auth = 'in'; layout(); render(); toast('Signed in'); }, 0); } }] });
}
function emailModal() {
  modal({ title: 'Change your email', focus: '#ce-e', body: `<p class="muted">We send a 6-digit code to the new address to check it is yours.</p><div class="field"><label class="label" for="ce-e">New email</label><input class="input" id="ce-e" type="email" autocomplete="email" placeholder="name@company.com"></div>`,
    actions: [{ label: 'Cancel' }, { label: 'Send code', cls: 'primary', fn: m => {
      const i = $('#ce-e', m), v = i.value.trim().toLowerCase(); if (!emailOk(v)) { setErr(i, 'Enter a valid email, like name@company.com.'); i.focus(); return false; }
      if (v === S.email.toLowerCase()) { setErr(i, 'This is already your email.'); i.focus(); return false; }
      if (v === 'maya@infusion.example') { setErr(i, 'Another account uses this email.'); i.focus(); return false; } setErr(i, '');
      if (!S.net) { toast(WHYM.offline, { error: true }); return false; }
      if (failed('send the code')) return false;
      later(() => codeModal(v), 0);
    } }] });
}
function codeModal(v, tries) {
  tries = tries || 0;
  modal({ title: 'Check your email', focus: '#cc-c', body: `<p class="muted">We sent a 6-digit code to <b>${esc(v)}</b>. It works for 10 minutes.</p><div class="field"><label class="label" for="cc-c">6-digit code</label><input class="input" id="cc-c" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"><p class="help">Try 123456.</p></div>`,
    actions: [{ label: 'Back', fn: () => { later(emailModal, 0); } }, { label: 'Confirm', cls: 'primary', fn: m => {
      const i = $('#cc-c', m), c = i.value.trim(); if (!/^\d{6}$/.test(c)) { setErr(i, 'Enter the 6 digits from the email.'); i.focus(); return false; }
      if (!S.net) { toast(WHYM.offline, { error: true }); return false; }
      if (c !== '123456') { tries++; if (tries >= 3) { later(() => { toast('Too many wrong codes. Start again.', { error: true }); emailModal(); }, 0); return; } setErr(i, 'That code is not right. ' + (3 - tries) + ' tries left.'); i.focus(); return false; }
      if (failed('change your email')) return false;
      S.email = v; renderBody(); toast('Email changed to ' + v + '.'); focusEl('#ch-email');
    } }] });
}
function delModal() {
  modal({ title: 'Delete your account?', focus: '#dl-e', body: `<p>Your account is removed on <b>${fdate(Date.now() + 7 * 864e5)}</b>. Until then you can sign in and cancel. Your history stays on your computers.</p><div class="field"><label class="label" for="dl-e">Type your email to confirm</label><input class="input" id="dl-e" autocomplete="off" spellcheck="false" placeholder="${esc(S.email)}"></div>`,
    actions: [{ label: 'Keep my account' }, { label: 'Delete my account', cls: 'danger-solid', fn: m => {
      const i = $('#dl-e', m); if (i.value.trim().toLowerCase() !== S.email.toLowerCase()) { setErr(i, 'Type ' + S.email + ' exactly.'); i.focus(); return false; } setErr(i, '');
      if (!S.net) { toast(WHYM.offline, { error: true }); return false; }
      if (failed('schedule the deletion')) return false;
      S.delAt = Date.now() + 7 * 864e5; renderBanners(); renderBody(); toast('Deletion scheduled for ' + fdate(S.delAt) + '.'); focusEl('#page-h');
    } }] });
}

/* ---------- actions ---------- */
Object.assign(A, {
  signin: () => { if (S.net) signInModal(); },
  billing: () => go('pricing'),
  tab: b => { S.tab = b.dataset.v; renderHead(); renderPanel(); focusEl('#page-h'); },
  nameCancel: () => { S.draft = null; renderBody(); focusEl('#ac-name'); },
  chEmail: () => { const g = gate(true); if (!g.ok) { toast(g.why); return; } emailModal(); },
  link: () => { const g = gate(true); if (!g.ok) { toast(g.why); return; }
    modal({ title: 'Link Google', body: `<p class="muted">You will be able to sign in with Google as well as an email code.</p><div class="mk-sign"><span class="ac-av" style="background:#fff;border:1px solid var(--border);color:var(--ink);width:44px;height:44px;border-radius:14px">${ic('g', 22)}</span><span><b>${esc(S.email)}</b><br><span class="muted">Google account</span></span></div>`, focus: '.btn.primary',
      actions: [{ label: 'Cancel' }, { label: 'Link Google', cls: 'primary', fn: () => { if (!S.net) { toast(WHYM.offline, { error: true }); return false; } if (failed('link Google')) return false; S.google = S.email; renderBody(); toast('Google linked'); focusEl('#unlink-g'); } }] }); },
  unlink: () => { const g = gate(true); if (!g.ok) { toast(g.why); return; }
    confirmModal({ title: 'Unlink Google?', text: 'You can still sign in with an email code sent to ' + S.email + '.', go: 'Unlink Google', fn: () => { if (!S.net) { toast(WHYM.offline, { error: true }); return false; } if (failed('unlink Google')) return false; S.google = null; renderBody(); toast('Google unlinked'); focusEl('#link-g'); } }); },
  outOne: b => { const g = gate(false); if (!g.ok) { toast(g.why); return; } const s = S.sessions.find(x => x.id === b.dataset.v);
    confirmModal({ title: 'Sign out of ' + s.name + '?', text: s.kind === 'local' ? 'Assistants on that computer pause until you sign in there again.' : 'That browser is signed out right away.', go: 'Sign out', fn: () => { if (!S.net) { toast(WHYM.offline, { error: true }); return false; } if (failed('sign out')) return false; S.sessions = S.sessions.filter(x => x !== s); renderBody(); toast('Signed out of ' + s.name); focusEl('#se-h'); } }); },
  outAll: () => { const g = gate(false); if (!g.ok) { toast(g.why); return; } if (!others().length) { toast('You are only signed in here.'); return; }
    confirmModal({ title: 'Sign out everywhere else?', text: others().length + ' other session' + (others().length === 1 ? '' : 's') + ' will be signed out. Assistants on your computers pause until you sign in there again.', go: 'Sign out everywhere else', fn: () => { if (!S.net) { toast(WHYM.offline, { error: true }); return false; } if (failed('sign out')) return false; S.sessions = S.sessions.filter(x => x.cur); renderBody(); toast('Signed out everywhere else'); focusEl('#se-h'); } }); },
  outHere: () => { if (!S.net) return; confirmModal({ title: 'Sign out of this browser?', text: 'You can sign in again with an email code or Google.', go: 'Sign out', fn: () => { later(() => { S.auth = 'out'; layout(); render(); toast('Signed out'); }, 0); } }); },
  nt: b => { const g = gate(false), n = S.notify.find(x => x.id === b.dataset.v), k = b.dataset.k; if (!g.ok) { toast(g.why); return; } if (n.lock && k === 'email') { toast(n.lock); return; } if (failed('save')) return; n[k] = !n[k]; renderBody(); focusEl('[data-a=nt][data-v="' + n.id + '"][data-k="' + k + '"]'); toast(n.t + ': ' + (k === 'email' ? 'email ' : 'in-app ') + (n[k] ? 'on' : 'off')); },
  quiet: () => { const g = gate(false); if (!g.ok) { toast(g.why); return; } if (failed('save')) return; S.quiet.on = !S.quiet.on; renderBody(); focusEl('[data-a=quiet]'); toast(S.quiet.on ? 'Quiet hours on' : 'Quiet hours off'); },
  testMail: () => { const g = gate(false); if (!g.ok) { toast(g.why); return; } if (failed('send the test email')) return; S.testSent = true; renderBody(); toast('Test email sent to ' + S.email); focusEl('#test-mail'); },
  exportData: () => { const g = gate(false); if (!g.ok) { toast(g.why); return; } if (failed('request the export')) return; S.exportAt = Date.now(); renderBody(); toast('We will email your data to ' + S.email + ' within 24 hours.'); focusEl('#export-btn'); },
  delAcc: () => { if (blockers().every(x => x.ok) && S.net && !S.delAt) delModal(); else toast((!S.net ? WHYM.offline : S.delAt ? 'Deletion is already scheduled.' : blockers().find(x => !x.ok).t)); },
  cancelDel: () => { if (!S.net) return; S.delAt = null; renderBanners(); renderBody(); toast('Deletion cancelled. Your account stays.'); },
  retryLoad: () => { S.load = 'loading'; renderPanel(); later(() => { S.load = 'ok'; syncDev(); render(); focusEl('#page-h'); }, 800); },
  devReset: () => { clearTimers(); closeModal(true); S = mState(); S.load = 'ok'; layout(); renderDev(); render(); toast('Reset'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'ac-name') { S.draft = e.target.value; const s = $('#ac-save'), c = $('#ac-ncancel'), g = gate(false); [[s, g.ok && dirty(), !g.ok ? g.why : 'No changes to save.'], [c, dirty(), 'No changes to undo.']].forEach(x => { if (x[1]) { x[0].removeAttribute('aria-disabled'); x[0].removeAttribute('data-why'); } else { x[0].setAttribute('aria-disabled', 'true'); x[0].setAttribute('data-why', x[2]); } }); if (e.target.getAttribute('aria-invalid') === 'true') setErr(e.target, ''); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'ac-nf') return; e.preventDefault(); const i = $('#ac-name'), v = i.value.trim(), g = gate(false);
  if (!g.ok) { toast(g.why); return; } if (!dirty()) { toast('No changes to save.'); return; }
  if (v.length < 2) { setErr(i, 'Enter at least 2 letters.'); i.focus(); return; } setErr(i, '');
  if (failed('save your name')) return;
  S.name = v; S.draft = null; renderBody(); toast('Name saved'); focusEl('#ac-name');
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'ac-col') { if (failed('save')) { renderBody(); return; } S.color = +t.value; renderBody(); toast('Avatar color saved'); focusEl('[name=ac-col]:checked'); return; }
  if (t.id === 'ac-tz') { const g = gate(false); if (!g.ok || S.saveFail) { t.value = S.tz; toast(g.ok ? 'Could not save. Try again.' : g.why, { error: !g.ok ? false : true }); return; } S.tz = t.value; toast('Time zone saved'); return; }
  if (t.id === 'q-from' || t.id === 'q-to') { const q = S.quiet, f = t.id === 'q-from' ? t.value : q.from, o = t.id === 'q-to' ? t.value : q.to; if (f === o) { t.value = t.id === 'q-from' ? q.from : q.to; toast('From and To must be different.', { error: true }); return; } if (failed('save')) { t.value = t.id === 'q-from' ? q.from : q.to; return; } q.from = f; q.to = o; renderBody(); toast('Quiet hours saved'); return; }
  if (!t.closest || !t.closest('#dev-body')) return; const v = t.value;
  if (t.id === 'dv-auth') S.auth = v; else if (t.id === 'dv-ld') S.load = v; else if (t.id === 'dv-net') S.net = t.checked; else if (t.id === 'dv-fail') S.saveFail = t.checked;
  else if (t.id === 'dv-mg') S.managed = v === 'yes'; else if (t.id === 'dv-plan') S.plan = v; else if (t.id === 'dv-sh') S.shared = v === 'yes' ? ['infusion', 'release-train'] : [];
  else if (t.id === 'dv-ses') S.sessions = v === 'none' ? S.sessions.filter(x => x.cur) : mState().sessions;
  layout(); render();
});
document.addEventListener('click', e => { const l = e.target.closest && e.target.closest('.ac-sw[aria-disabled=true], select[aria-disabled=true]'); if (l && l.dataset.why) toast(l.dataset.why); });
function syncDev() { const e = $('#dv-ld'); if (e) e.value = S.load; }
function renderDev() {
  const o = (id, l, opts) => `<div class="field"><label class="label" for="${id}">${l}</label><select class="select" id="${id}">${opts.map(x => `<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div>`;
  $('#dev-body').innerHTML = o('dv-auth', 'Signed in', [['in', 'Yes'], ['out', 'No']]) + o('dv-ld', 'Page data', [['ok', 'Loaded'], ['loading', 'Loading'], ['error', 'Load error']]) + o('dv-mg', 'Managed by a company', [['no', 'No'], ['yes', 'Yes (admin controls)']]) + o('dv-plan', 'Plan', [['pro', 'Pro'], ['team', 'Team'], ['trial', 'Free trial'], ['free', 'Free (admin)'], ['none', 'No plan']]) + o('dv-sh', 'Owns shared projects', [['yes', 'Yes'], ['no', 'No']]) + o('dv-ses', 'Other sessions', [['some', 'Some'], ['none', 'None']])
    + `<label class="check"><input type="checkbox" id="dv-net" checked><span class="check-text">Internet</span></label><label class="check"><input type="checkbox" id="dv-fail"><span class="check-text">Saving fails</span></label><div class="cluster" style="margin-top:var(--sp-2)">${btn('Reset', { cls: 'sm', a: 'devReset' })}</div>`;
}
renderDev(); layout(); render(); later(() => { S.load = 'ok'; syncDev(); render(); }, 900);

})();
</script>
